name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable

      - uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.1
        with:
          ssh-private-key: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Homebrew formula to tap
        run: |
          TAG="${GITHUB_REF_NAME}"
          git clone git@github.com:Hxmbl/homebrew-tap.git /tmp/homebrew-tap
          cp dist/homebrew/everything.rb /tmp/homebrew-tap/everything.rb
          cd /tmp/homebrew-tap
          git config user.name "hxmbl"
          git config user.email "hxmbl@users.noreply.github.com"
          git add everything.rb
          if git diff --cached --quiet; then
            echo "Formula unchanged, skipping commit"
          else
            git commit -m "everything ${TAG}"
            git push origin HEAD
          fi
